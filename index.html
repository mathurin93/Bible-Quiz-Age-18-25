<script>
"use strict";
const lessons = [
  {
    "n": 19,
    "title": "What following Jesus costs",
    "topic": "Marriage, children, and possessions",
    "intro": "Jesus teaches about relationships, welcomes children, and challenges a wealthy man. The chapter asks what we are willing to release in order to follow him.",
    "memory": "26",
    "theme": "Salvation depends on God’s power, not human ability.",
    "remember": [
      "Jesus welcomes the children whom the disciples tried to turn away.",
      "The wealthy man’s possessions make Jesus’ invitation difficult for him.",
      "Peter asks about those who have left everything to follow Jesus."
    ],
    "discuss": "What possession, ambition, or source of security could make it hard for you to follow Jesus wholeheartedly?",
    "sections": [
      [
        "1–12",
        "Marriage and commitment",
        "Asked about divorce, Jesus returns to God’s purpose for marriage. He also speaks about remaining unmarried for the kingdom."
      ],
      [
        "13–15",
        "Children are welcome",
        "The disciples try to turn people bringing children away. Jesus welcomes the children and blesses them."
      ],
      [
        "16–22",
        "A difficult invitation",
        "A wealthy young man asks about eternal life. Jesus calls him to give to the poor and follow him, but he leaves sadly."
      ],
      [
        "23–30",
        "God makes the impossible possible",
        "Jesus warns about wealth becoming an obstacle. He answers the disciples’ concern about salvation by pointing to God’s power and promises lasting reward to his followers."
      ]
    ]
  },
  {
    "n": 20,
    "title": "Greatness through service",
    "topic": "Vineyard wages and a request for honor",
    "intro": "Jesus challenges expectations about reward and status. His journey toward Jerusalem reveals a king who serves and gives his life.",
    "memory": "28",
    "theme": "Jesus models service and gives his life for others.",
    "remember": [
      "Every vineyard worker receives a denarius.",
      "Greatness among Jesus’ followers is expressed in service.",
      "Matthew describes two blind men near Jericho."
    ],
    "discuss": "Where could you serve this week without seeking recognition or a higher position?",
    "sections": [
      [
        "1–16",
        "A generous landowner",
        "Workers hired at different times receive the same agreed daily wage. The landowner answers complaints by defending his generosity."
      ],
      [
        "17–19",
        "The road to Jerusalem",
        "Jesus tells the Twelve that he will be condemned, killed, and raised on the third day."
      ],
      [
        "20–28",
        "A different kind of greatness",
        "The mother of Zebedee’s sons requests places of honour for them. Jesus teaches the disciples to lead by serving."
      ],
      [
        "29–34",
        "Mercy outside Jericho",
        "Two blind men persistently call to Jesus despite the crowd’s objections. He restores their sight, and they follow him."
      ]
    ]
  },
  {
    "n": 21,
    "title": "The king enters Jerusalem",
    "topic": "The temple, a fig tree, and a vineyard",
    "intro": "Jesus arrives in Jerusalem and confronts empty religion. His actions and parables expose the difference between words and faithful response.",
    "memory": "22",
    "theme": "Jesus calls his followers to pray with faith.",
    "remember": [
      "The crowds identify Jesus as the prophet from Nazareth.",
      "The son who changes his mind and goes is the one who obeys.",
      "The vineyard owner sends his son after his servants."
    ],
    "discuss": "Where do your actions need to catch up with what you say you believe?",
    "sections": [
      [
        "1–11",
        "A king welcomed",
        "Two disciples bring a donkey and her colt. Crowds spread clothing and branches as Jesus enters Jerusalem."
      ],
      [
        "12–22",
        "The temple and the fig tree",
        "Jesus clears the temple courts and heals people there. A fruitless fig tree withers, prompting teaching about faith and prayer."
      ],
      [
        "23–27",
        "A question about authority",
        "Religious leaders challenge Jesus. He responds by asking them to identify the source of John’s baptism."
      ],
      [
        "28–32",
        "Two sons, different responses",
        "One son refuses his father but later obeys; the other agrees but never acts. Jesus highlights the importance of a changed response."
      ],
      [
        "33–46",
        "The vineyard tenants",
        "Tenants reject the owner’s servants and kill his son. Jesus connects the story with the rejected stone becoming central to God’s work."
      ]
    ]
  },
  {
    "n": 22,
    "title": "Love, allegiance, and truth",
    "topic": "A wedding feast and questions for Jesus",
    "intro": "A wedding story and difficult questions reveal the seriousness of responding to God. Jesus brings the Law into focus through love for God and neighbour.",
    "memory": "37–39",
    "theme": "Love for God and neighbour belongs at the centre of obedience.",
    "remember": [
      "The tax coin bears Caesar’s image.",
      "The Sadducees deny the resurrection.",
      "Jesus links love for God with love for one’s neighbour."
    ],
    "discuss": "What would loving God and your neighbour change about a decision you are making now?",
    "sections": [
      [
        "1–14",
        "The wedding invitation",
        "Invited guests reject the king’s banquet. New guests are gathered from the highways, and the story also stresses a fitting response to the invitation."
      ],
      [
        "15–22",
        "The tax question",
        "Opponents try to trap Jesus over paying Caesar. He uses the image on a coin to distinguish obligations to Caesar and to God."
      ],
      [
        "23–33",
        "Resurrection and God’s power",
        "Sadducees present a marriage puzzle. Jesus challenges their understanding of Scripture and God’s power, affirming the resurrection."
      ],
      [
        "34–40",
        "The greatest commandments",
        "Jesus identifies love for God as the foremost command and love for one’s neighbour as the second. These guide the Law and the Prophets."
      ],
      [
        "41–46",
        "David’s son and Lord",
        "Jesus asks how the Christ can be David’s son while David also calls him Lord. His opponents cannot answer."
      ]
    ]
  },
  {
    "n": 23,
    "title": "Integrity beyond appearances",
    "topic": "Leadership, mercy, and inward change",
    "intro": "Jesus warns his listeners about religious hypocrisy and the pursuit of status. He calls for humility, inward integrity, justice, mercy, and faith.",
    "memory": "11–12",
    "theme": "Humble service matters more than self-promotion.",
    "remember": [
      "Jesus connects greatness with being a servant.",
      "Justice, mercy, and faith must not be neglected.",
      "A hen gathering chicks pictures Jesus’ longing for Jerusalem."
    ],
    "discuss": "Is there a gap between the image you present and the way you treat people when no one is watching?",
    "sections": [
      [
        "1–12",
        "Practice what you teach",
        "Jesus describes leaders whose conduct contradicts their teaching. He directs his followers toward humble service instead of public prestige."
      ],
      [
        "13–22",
        "Misleading spiritual leadership",
        "Jesus condemns leaders who block others from the kingdom, exploit widows while making a show of prayer, and manipulate oaths. He challenges the priorities beneath their religious rules."
      ],
      [
        "23–28",
        "What really matters",
        "Careful attention to small offerings does not excuse neglecting justice, mercy, and faith. Clean appearances cannot replace a clean heart."
      ],
      [
        "29–36",
        "Prophets and accountability",
        "Jesus warns those who honour past prophets while continuing the pattern of rejecting God’s messengers."
      ],
      [
        "37–39",
        "Sorrow over Jerusalem",
        "Jesus grieves over Jerusalem’s resistance. He compares his desire to gather its people with a hen sheltering her chicks."
      ]
    ]
  },
  {
    "n": 24,
    "title": "Stay faithful and ready",
    "topic": "The temple, watchfulness, and service",
    "intro": "Jesus answers questions about the temple and his coming. He warns against deception and calls for endurance, watchfulness, and faithful responsibility.",
    "memory": "42–44",
    "theme": "Remain ready because the time of Jesus’ coming is unknown.",
    "remember": [
      "The disciples question Jesus on the Mount of Olives.",
      "Jesus warns that impressive claims can still be deceptive.",
      "Readiness includes continuing to act faithfully."
    ],
    "discuss": "What does faithful readiness look like in your ordinary responsibilities, without trying to predict a date?",
    "sections": [
      [
        "1–14",
        "The temple and coming trouble",
        "Jesus predicts the temple’s destruction. He warns of deception, conflict, persecution, and the need to persevere as the kingdom message reaches the nations."
      ],
      [
        "15–28",
        "Urgent warnings",
        "Jesus describes a time of severe distress and warns against deceptive claims about the Christ. He compares his coming with lightning visible across the sky."
      ],
      [
        "29–35",
        "The Son of Man and the fig tree",
        "Jesus describes the Son of Man coming in glory. The fig tree becomes an illustration about recognising what is near."
      ],
      [
        "36–44",
        "The unknown day",
        "Only the Father knows the day and hour. Noah’s generation and an unexpected thief illustrate why people must remain ready."
      ],
      [
        "45–51",
        "Faithfulness while waiting",
        "A responsible servant continues caring for the household during the master’s absence. An abusive servant is held accountable when the master returns."
      ]
    ]
  },
  {
    "n": 25,
    "title": "Readiness that becomes action",
    "topic": "Lamps, talents, and practical care",
    "intro": "Jesus illustrates readiness through waiting, responsibility, and compassion. These scenes connect anticipation of his coming with the choices people make now.",
    "memory": "35–40",
    "theme": "Care for people in need is a serious expression of service to Jesus.",
    "remember": [
      "Five of the ten bring extra oil.",
      "The servants receive five talents, two talents, and one talent.",
      "The judgment scene names food, drink, welcome, clothing, care, and visits."
    ],
    "discuss": "Which responsibility or opportunity to care for someone are you tempted to postpone?",
    "sections": [
      [

  &&(run===null||(items(run)&&Number.isInteger(run.pos)&&run.pos>=0&&run.pos<run.ids.length&&
    [run.pos,run.pos+1].includes(run.answers.length)&&list(run.orders,o=>list(o,x=>Number.isInteger(x)&&x>=0&&x<4)&&o.length===4&&new Set(o).size===4)

 `<button class="btn" data-act="answer" ${r.pick===null?"disabled":""}>${r.mode==="mock"?"Submit answer":"Check answer"}</button>${button("skip","Skip","quiet")}`}</div></div>
 ${link("study",r.until?"Return to study hub · timer keeps running":"Save and return to study hub")}</div>`;
}
function answer(skip){
 const r=state.run;if(!r||r.answers.length!==r.pos||(!skip&&r.pick===null))return;
 r.answers.push(skip?-1:r.pick);if(skip)r.pick=null;
 if(r.mode==="mock")next();else{save();draw();}
}
function next(){
 const r=state.run;if(!r||r.answers.length!==r.pos+1)return;
 if(r.pos+1===r.ids.length){finish();return;}
 r.pos++;r.pick=null;save();draw();$("main").focus({preventScroll:true});
}
function finish(expired=false){
 const r=state.run;if(!r)return;
 const record={date:Date.now(),ids:r.ids,answers:r.ids.map((_,i)=>r.answers[i]??-1),mode:r.mode,expired};
 for(const [i,id] of r.ids.entries()){
  const missed=record.answers[i]!==0;state.review=toggle(state.review,id,missed);
  if(missed)state.known=toggle(state.known,id,false);
 }
 state.history.unshift(record);state.run=null;save();
 if(page==="quiz")go("result/"+record.date);else draw();
}
function tick(){
 const until=state?.run?.until;if(!until)return;
 const sec=Math.max(0,Math.ceil((until-Date.now())/1000));
 if(!sec){finish(true);return;}
 if($("clock"))$("clock").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
const currentResult=()=>state.history.find(r=>r.date===Number(arg))||state.history[0];
function results(){
 const r=currentResult();if(!r)return setupView();
 const right=score(r),miss=r.ids.length-right;
 return `<div class="quizbox"><section class="panel sage"><div class="eyebrow">${r.mode} complete${r.expired?" · Time is up":""}</div>
 <h1>${percent(right,r.ids.length)}%</h1><h3>${right} of ${r.ids.length} correct</h3><div class="flex flex-wrap gap-3 mt-4">
 ${miss?button("miss","Retry "+miss+" missed"):""}${link("quiz","Choose another quiz","quiet")}</div></section><h2>Your answer review</h2>
 ${r.ids.map((id,i)=>`<details><summary>${r.answers[i]===0?"✓":"○"}　${byRef.get(id).ask}</summary>${feedback(byRef.get(id),r.answers[i])}</details>`).join("")}</div>`;
}
function eligible(q){return (!cardScope||cardScope===q.n)&&(cardFilter==="all"||(cardFilter==="review"?state.review.includes(q.ref):!state.known.includes(q.ref)));}
function resetDeck(){deck=sample(bank.filter(eligible));at=0;flipped=false;}
function flashcards(){
 const q=deck[at];return title("Flashcards","Flip. Remember. Repeat.","Say your answer out loud before turning over the card.")+
 `<div class="flashbox"><div class="flex flex-wrap items-center gap-3"><label class="field">Chapter<select id="cardScope">${chapterOptions(cardScope)}</select></label>
 <label class="field">Card set<select id="cardFilter">${option("all","All cards",cardFilter)}${option("new","Still learning",cardFilter)}${option("review","Needs practice",cardFilter)}</select></label>${button("shuffle","Shuffle","quiet")}</div>
 ${q?`<div class="flex justify-between"><span>Card ${at+1} of ${deck.length}</span><span>${state.known.includes(q.ref)?"✓ Learned":"Matthew "+q.n}</span></div>
 <button class="flash ${flipped?"flipped":""}" data-act="flip"><span class="eyebrow">${flipped?"The answer · Matthew "+q.ref:"Think first"}</span>
 <strong>${flipped?q.options[0]:q.ask}</strong><span>${flipped?"Tap to see the question":"Tap to reveal the answer"}</span></button>
 <div class="flex flex-wrap gap-3">${flipped?button("learn","✓ I know this")+button("again","Practice again","quiet"):button("flip","Show answer")}
 ${at?button("prevCard","← Previous","link"):""}${button("nextCard","Next →","link")}</div>`:
 `<section class="panel sage"><h2>${deck.length?"You reached the end of this set.":"No cards in this set."}</h2><p>Choose another set or shuffle the deck to practice again.</p>${button("allCards","Show all cards","quiet mt-4")}</section>`}</div>`;
}
function rate(learned){
 const q=deck[at];if(!q||!flipped)return;
 state.known=toggle(state.known,q.ref,learned);state.review=toggle(state.review,q.ref,!learned);
 if(eligible(q))at++;else deck.splice(at,1);
 flipped=false;save();draw();
}
function planWeeks(){
 const nums=chapters.map(c=>c.n),chunks=[nums.slice(0,3),nums.slice(3,6),nums.slice(6)];
 const weeks=chunks.map(ns=>{
  const tasks=ns.map(n=>["Read Matthew "+n+" and retell the chapter.","study/"+n]);
  if(tasks.length<4)tasks.push(["Practice the week’s memory passage aloud.","study/"+ns.at(-1)]);
  if(tasks.length<4)tasks.push(["Use flashcards to recall people, places, and events.","cards/"+ns[0]]);
  tasks.push(["Quiz yourself on Matthew "+ns.at(-1)+".","quiz/"+ns.at(-1)]);
  return tasks;
 });
 weeks.push([["Retell each chapter using its title as a cue.","study"],["Practice your flashcards aloud.","cards"],
 ["Revisit cards marked for more practice.","cards/review"],["Take a mixed mock quiz.","quiz/mock"],["Check your results and reread a difficult passage.","progress"]]);
 return weeks;
}
function plan(){
 return title("Four weeks · Matthew "+rangeName(),"A clear path to quiz day.","Read a little each day and check off each step as you finish.")+
 `<p><b>${state.days.length} of 20 days complete</b></p><progress max="20" value="${state.days.length}" aria-label="Study days complete"></progress>
 <div class="weeks mt-4">${planWeeks().map((week,w)=>`<section class="panel"><div class="eyebrow">Week ${w+1}</div><h2>${["Read and retell","Look for connections","Practice recall","Review for quiz day"][w]}</h2>
 ${week.map(([task,path],i)=>{const d=w*5+i;return `<div class="day"><label class="check"><input type="checkbox" data-list="days" value="${d}" ${state.days.includes(d)?"checked":""}>
 <span><b>Day ${d+1}</b> · ${task}</span></label>${link(path,"Open activity →")}</div>`;}).join("")}</section>`).join("")}</div>
 <section class="panel"><h2>Memory passages</h2>${chapters.map(c=>`<div class="row"><label class="check"><input type="checkbox" data-list="memory" value="${c.n}" ${state.memory.includes(c.n)?"checked":""}>I can recite Matthew ${c.n}:${c.memory}</label>${bible(c.n+":"+c.memory,"Read this passage")}</div>`).join("")}</section>`;
}
function progressView(){
 return title("My progress","Your learning is adding up.","Use your results to choose a chapter to revisit.")+stats()+
 `<div class="twocol"><section class="panel"><h2>Chapter by chapter</h2>${chapters.map(c=>{
  const qs=bank.filter(q=>q.n===c.n),learned=qs.filter(q=>state.known.includes(q.ref)).length;
  const answers=state.history.flatMap(r=>r.answers.filter((_,i)=>byRef.get(r.ids[i]).n===c.n));
  return `<div class="row">${link("study/"+c.n,"Matthew "+c.n+" · "+c.title)}<p>${state.read.includes(c.n)?"✓ Studied":"Ready to read"} · ${learned}/${qs.length} cards learned</p>
  <small>${answers.length?percent(answers.filter(a=>a===0).length,answers.length)+"% correct in quizzes":"No quiz answers yet"}</small></div>`;
 }).join("")}</section><div><section class="panel warm"><h2>Quiz history</h2>${state.run?link("quiz","Resume unfinished quiz　→"):""}
 ${state.history.length?state.history.slice(0,12).map(r=>`<div class="row">${link("result/"+r.date,new Date(r.date).toLocaleDateString()+" · "+r.mode+" · "+score(r)+"/"+r.ids.length)}</div>`).join(""):"<p>Your completed quizzes will appear here.</p>"}
 ${state.review.length?button("retry","Practice "+state.review.length+" to review","link mt-4"):""}</section>
 <section class="panel"><h3>Your progress backup</h3><p>Copy or restore this class’s progress on another device.</p>${button("backup","Back up or restore","quiet mt-4")}</section></div></div>`;
}
function dialog(heading,body){
 $("help").innerHTML=`<div class="flex items-center justify-between gap-3"><h2 id="helpTitle">${heading}</h2>${button("close","×","round")}</div>${body}`;
 if(!$("help").open)$("help").showModal();
}
function help(){
 dialog("Teacher notes",`<p><b>Ages ${ages()} · Matthew ${rangeName()} · NKJV</b></p>
 <p>Read a passage together. Have one student retell it, another name a detail, and a third find the supporting verse. Finish with a short quiz and revisit any missed answers.</p>
 <p>The study notes use original wording. Open the full-chapter reader in each guide for the NKJV text. Full chapters use an internet connection.</p>
 <label class="field">Study text size<select id="textSize">${[18,20,22].map(n=>option(n,n+" px",state.size)).join("")}</select></label>
 <p class="meta">Suggested memory passages and practice questions are for class study. Use your organizer’s list for competition day. NKJV © 1982 Thomas Nelson. Online reader provided by Biblia.</p>`);
}
function backup(){
 dialog("Class progress backup",`<p>Keep a copy of this text. To restore a backup for ages ${ages()}, paste it here and choose Restore.</p>
 <textarea id="backupText" aria-label="Progress backup" rows="7" style="width:100%;font:16px monospace"></textarea>
 <div class="flex flex-wrap gap-3 mt-4">${button("copy","Copy backup")}${button("restore","Restore","quiet")}</div><p id="backupMsg" role="status"></p>`);
 $("backupText").value=JSON.stringify({app:"Matthew Quest",version:1,group,state});
}
function restore(){
 try{
  const b=JSON.parse($("backupText").value);
  if(b.app!=="Matthew Quest"||b.version!==1||b.group!==group||!validState(b.state))throw Error();
  if(!confirm("Replace this class’s saved progress with the backup?"))return;
  state=b.state;save();resetDeck();$("help").close();draw();tick();
 }catch{$("backupMsg").textContent="Paste a complete progress backup from this age group.";}
}
function draw(){
 nav();document.documentElement.style.setProperty("--reading",state.size+"px");
 const views={study:()=>chapter(arg)?lesson(chapter(arg)):homeView(),quiz:()=>state.run?liveQuiz():setupView(),result:results,cards:flashcards,plan,progress:progressView};
 $("main").innerHTML=(storageOK?"":'<p class="panel warm">This browser can keep progress for this visit. Use a progress backup to keep it for later.</p>')+views[page]();
 const reader=$("reader");
 if(reader)reader.ontoggle=()=>{
  if(!reader.isConnected||!reader.open||$("frameSlot").firstChild)return;
  const n=chapter(arg).n,frame=document.createElement("iframe");
  frame.title="Matthew "+n+" in the New King James Version";
  frame.src="https://biblia.com/api/plugins/embeddedbible?layout=normal&resourceName=NKJV&resourcePicker=false&startingReference=Mt"+n+".1";
  $("frameSlot").append(frame);
 };
}
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
 const action=el.dataset.act,v=el.dataset.value;
 if(["pick","answer","skip","next"].includes(action)&&state.run?.until&&Date.now()>=state.run.until){finish(true);return;}
 switch(action){
 case "help":help();break;
 case "close":$("help").close();break;
 case "read":state.read=toggle(state.read,Number(v));save();draw();break;
 case "mode":setup.mode=v;draw();break;
 case "mixed":start(sample(bank).slice(0,10).map(q=>q.ref));break;
 case "start":{
  const mock=setup.mode==="mock",pool=bank.filter(q=>!setup.scope||q.n===setup.scope);
  start(mock?mockIds():sample(pool).slice(0,setup.count).map(q=>q.ref),setup.mode,mock&&setup.timed);break;
 }
 case "pick":if(state.run&&state.run.answers.length===state.run.pos){state.run.pick=Number(v);save();draw();document.querySelector('[data-act="answer"]').focus({preventScroll:true});}break;
 case "answer":answer(false);break;
 case "skip":answer(true);break;
 case "next":next();break;
 case "retry":start(sample(state.review));break;
 case "miss":{const r=currentResult();start(sample(r.ids.filter((_,i)=>r.answers[i]!==0)));break;}
 case "flip":flipped=!flipped;draw();document.querySelector(".flash")?.focus({preventScroll:true});break;
 case "learn":rate(true);break;
 case "again":rate(false);break;
 case "prevCard":at=Math.max(0,at-1);flipped=false;draw();break;
 case "nextCard":at++;flipped=false;draw();break;
 case "shuffle":resetDeck();draw();break;
 case "allCards":cardFilter="all";cardScope=0;resetDeck();go("cards");break;
 case "backup":backup();break;
 case "copy":
  $("backupText").select();
  try{await navigator.clipboard.writeText($("backupText").value);$("backupMsg").textContent="Copied.";}
  catch{$("backupMsg").textContent="The backup text is selected. Use your device’s Copy command.";}break;
 case "restore":restore();break;
 }
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.list){const name=el.dataset.list,n=Number(el.value);state[name]=toggle(state[name],n,el.checked);save();draw();document.querySelector('[data-list="'+name+'"][value="'+n+'"]')?.focus({preventScroll:true});return;}
 switch(el.id){
 case "quizScope":setup.scope=Number(el.value);setup.count=setup.scope?8:10;draw();break;
 case "count":setup.count=Number(el.value);break;
 case "timed":setup.timed=el.checked;break;
 case "cardScope":cardScope=Number(el.value);resetDeck();draw();break;
 case "cardFilter":cardFilter=el.value;resetDeck();draw();break;
 case "textSize":state.size=Number(el.value);save();document.documentElement.style.setProperty("--reading",state.size+"px");break;
 }
});
document.querySelector(".skip").onclick=e=>{e.preventDefault();$("main").focus();};
$("logo").innerHTML=icon("book");$("sprout").innerHTML=icon("sprout");
window.addEventListener("hashchange",route);setInterval(tick,500);loadClass();route();
</script>
</body>
</html>
